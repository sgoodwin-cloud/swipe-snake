<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Swipe Snake</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<meta name="theme-color" content="#1f2a24">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen&display=swap">
<style>
/* Layout: one-screen handheld — HUD strip, square LCD board, brake meter / hint line. Deliberately single-theme (LCD look). */
:root {
  --case: #1f2a24;
  --bezel: #121915;
  --lcd: #a7b98a;
  --lcd-dim: #97aa7b;
  --pixel: #26331f;
  --ink: #d9e4c6;
  --muted: #8a9a84;
  --f-display: "Silkscreen", "Courier New", monospace;
  --f-digits: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; touch-action: none; }
[hidden] { display: none !important; }
body {
  background: var(--case);
  color: var(--ink);
  font-family: var(--f-digits);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex; flex-direction: column; justify-content: center;
  gap: 14px;
  padding-block: 12px;
  box-sizing: border-box;
}
.top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-family: var(--f-display);
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  min-height: 34px;
}
.top span { white-space: nowrap; }
.top b { font-family: var(--f-digits); font-weight: 400; font-size: 28px; color: var(--ink); letter-spacing: 0; margin-left: 6px; font-variant-numeric: tabular-nums; }
.bezel {
  background: var(--bezel);
  padding: 12px;
  border-radius: 10px 10px 34px 10px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
}
#board {
  position: relative;
  width: 100%; aspect-ratio: 1; max-width: 100%;
  touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; border-radius: 3px; }
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  color: var(--pixel); text-align: center;
  pointer-events: none;
  padding: 12px; box-sizing: border-box;
}
.overlay h1 { font-family: var(--f-display); font-size: 26px; margin: 0; letter-spacing: .04em; text-wrap: balance; }
.overlay p { font-size: 22px; margin: 0; }
.overlay .sub { font-size: 20px; opacity: .85; }
.menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; pointer-events: auto; max-width: 260px; }
.menu:empty { display: none; }
.menu button {
  font-family: var(--f-display); font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
  background: var(--pixel); color: var(--lcd);
  border: 2px solid var(--pixel); border-radius: 4px;
  padding: 11px 14px; min-width: 112px; cursor: pointer;
}
.menu button.ghost { background: transparent; color: var(--pixel); }
.menu button.wide { flex-basis: 100%; }
.menu.cards { flex-direction: column; flex-wrap: nowrap; width: 100%; max-width: 340px; gap: 8px; margin-top: 6px; }
.menu button.card {
  display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; align-items: baseline;
  width: 100%; min-width: 0; padding: 8px 10px; text-align: left; text-transform: none; letter-spacing: 0;
}
.card .cn { font-family: var(--f-display); font-size: 14px; letter-spacing: .05em; text-transform: uppercase; }
.card .ct { font-family: var(--f-display); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.card .cd { grid-column: 1 / -1; font-family: var(--f-digits); font-size: 18px; line-height: 1; }
.menu.cards button.card { padding: 7px 10px; }
.overlay .build { font-size: 18px; line-height: 1.1; max-width: 300px; }
.charges { font-family: var(--f-display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.under { display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 24px; }
.hint { text-align: center; font-size: 19px; color: var(--muted); margin: 0; }
.meter { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.segs { display: flex; gap: 3px; }
.segs i { width: 12px; height: 14px; background: var(--bezel); border-radius: 1px; }
.segs i.on { background: var(--lcd); }
.meter.empty .segs i.on { background: var(--muted); }
@media (prefers-reduced-motion: reduce) { .blink { animation: none !important; } }
.blink { animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; }
#update {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--lcd); color: var(--pixel);
  font-family: var(--f-display); font-size: 13px; letter-spacing: .06em;
  border: 0; border-radius: 6px; padding: 12px 18px; cursor: pointer;
}
.ver { text-align: center; font-size: 15px; color: var(--muted); margin: 0; opacity: .7; }
</style>

</head>
<body>
<div class="app">
  <div class="top" id="hud"></div>
  <div class="bezel">
    <div id="board">
      <canvas id="c"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="ovTitle">SNAKE</h1>
        <div id="ovLines"></div>
        <p class="blink" id="ovMsg"></p>
        <div class="menu" id="ovMenu"></div>
      </div>
    </div>
  </div>
  <div class="under">
    <div class="meter" id="meter" hidden><span>Brake</span><div class="segs" id="segs"></div><span class="charges" id="charges"></span></div>
    <p class="hint" id="hint">Swipe to steer · hold to brake</p>
  </div>
  <p class="ver">v<span id="ver">9</span></p>
</div>
<button id="update" hidden>Update ready · tap to reload</button>

<script>
(() => {
  'use strict';

  /* ====================================================================
   * 1. CONFIG & TUNING — every gameplay number lives here
   * ==================================================================== */
  const N = 16;                       // grid cells per side
  const CFG = {
    run: {
      floors: 9, floorsPerAct: 3,
      targets: [6, 8, 10],            // food to open the exit, per act
      actStepMs: [160, 145, 130],     // ms per move, per act
      startLength: 3,
      foodPoints: 10,                 // × act number
      clearBonus: 20,                 // × floor number
      winBonus: 100,
      clearPauseMs: 650,              // jingle time before the next floor
    },
    classic: { stepMs: 140, speedupEvery: 5, speedupMs: 10, minStepMs: 60 },
    brake: {
      holdMs: 250,                    // finger still this long = brake
      stillPx: 10,                    // how far the finger can drift and still count as "still"
      timeScale: 0.5,
      maxMs: 3000,                    // seconds of braking from full
      refillMs: 6000,                 // empty → full when not braking
      resumeAt: 0.25,                 // once emptied, usable again at this fraction
      segments: 12,
    },
    swipe: { thresh: 22, edge: 28 },
    queueMax: 2,
    draft: { choices: 3, familyBias: 0.6 },   // weight = 1 + familyBias × mutations already held in that family
    mut: {
      batteryPerSeg: 0.04,             // Battery: +4% food value per segment beyond start length, per level
      magnetRadius: [3, 4, 5],         // Magnet: pull range in tiles (Manhattan), by level
      magnetEvery: 2,                  // Magnet: food drifts one tile every N moves
      goldenChance: [0.2, 0.32, 0.45], // Golden Hour: chance a new food spawns golden, by level
      goldenMult: 3, goldenSteps: 45,  // golden food value × and how many moves before it fades
      gourmetWindow: [14, 20, 26],     // Gourmet: max moves between bites to keep a combo, by level
      gourmetBonus: 0.5,               // Gourmet: bonus = base value × this × combo
      deepTankPerLevel: 0.5,           // Deep Tank: +50% brake meter per level
      quickRecoveryPerLevel: 1,        // Quick Recovery: refill ×2 at level 1, ×3 at level 2
      spikedMult: [2, 4],              // Spiked: squashed beetle = base food value × this, by level
    },
    beetle: { everySteps: 2, minSpawnDist: 5 },   // beetles move once per N snake moves; never spawn this close to your head
    shrink: { warnSteps: 20 },        // the ring flashes for this many moves (starts at half the food target), then closes
    fx: { burstCount: 8, burstMs: 380, shakeMs: 450, shakeCells: 0.35, deathMs: 750, exitSweepMs: 450, popupMs: 750 },
    inputLockMs: 600,                 // ignore buttons/swipes briefly after a game ends
  };
  const DIRS = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
  const actOf = floor => Math.ceil(floor / CFG.run.floorsPerAct);

  /* ====================================================================
   * 2. RNG — seeded, so every run is reproducible (daily challenge later)
   *    Game decisions use the board's rng; cosmetic effects use Math.random.
   * ==================================================================== */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const newSeed = () => (Math.random() * 4294967296) >>> 0;
  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];

  /* ====================================================================
   * 3. SAVE SYSTEM — one versioned JSON object under one key
   * ==================================================================== */
  const SAVE_KEY = 'swipe-snake-save';
  const SAVE_VERSION = 1;
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  function defaultSave() {
    return {
      v: SAVE_VERSION, bits: 0,
      unlocked: { palettes: ['lcd'], music: [], effects: [], skins: ['classic'], mutations: [], perks: [] },
      equipped: { palette: 'lcd', music: null, effects: [], skin: 'classic', perk: null },
      overclock: { max: 0, selected: 0 },
      achievements: {},
      stats: { runs: 0, wins: 0, bestFloor: 0, bestRunScore: 0, classicBest: 0 },
      settings: { sound: true },
    };
  }
  function migrate(d) {
    // Version steps go here as the format changes, e.g. if (d.v === 1) { …; d.v = 2; }
    const base = defaultSave();
    for (const k in base) {
      if (d[k] === undefined) d[k] = base[k];
      else if (isObj(base[k]) && isObj(d[k])) for (const k2 in base[k]) if (d[k][k2] === undefined) d[k][k2] = base[k][k2];
    }
    return d;
  }
  function loadSave() {
    let d = null;
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
    if (!isObj(d)) {
      d = defaultSave();
      // v5 and earlier kept only the classic best score
      try { const old = parseInt(localStorage.getItem('snake-best') || '0', 10); if (old > 0) d.stats.classicBest = old; } catch (e) {}
    }
    return migrate(d);
  }
  function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
  const save = loadSave();
  writeSave();

  /* ====================================================================
   * 6. CONTENT DATA — mutations (in-run upgrades, §6.4)
   *    text(level) describes the level being offered. Most stack up to `max`.
   *    Array order is also hook priority (e.g. Phase is spent before Armoured).
   * ==================================================================== */
  const FAMILIES = { body: 'Body', appetite: 'Appetite', move: 'Movement' };
  const roman = n => ['', '', ' II', ' III'][n] || '';
  const MUTATIONS = [
    // ---- Movement & Brake
    { id: 'phase', name: 'Phase', family: 'move', max: 2,
      text: l => l === 1 ? 'Pass through your own body once per floor.' : 'Pass through your body twice per floor.',
      hooks: {
        onFloorStart(l, g) { g.charges.phase = l; },
        onSelfCollide(l, c) { if (game.charges.phase > 0) { game.charges.phase--; return 'phase'; } return null; },
      } },
    { id: 'wrap', name: 'Wraparound', family: 'move', max: 1,
      text: () => 'Leave the board through any edge without a wall and come back on the other side.',
      hooks: { onWall(l, head) { return [(head[0] + N) % N, (head[1] + N) % N]; } } },
    { id: 'deeptank', name: 'Deep Tank', family: 'move', max: 2,
      text: () => 'Brake meter holds 50% more.',
      hooks: { brakeMax(v, l) { return v * (1 + CFG.mut.deepTankPerLevel * l); } } },
    { id: 'quickrec', name: 'Quick Recovery', family: 'move', max: 2,
      text: l => l === 1 ? 'Brake meter refills twice as fast.' : 'Brake meter refills three times as fast.',
      hooks: { brakeRefill(v, l) { return v / (1 + CFG.mut.quickRecoveryPerLevel * l); } } },
    { id: 'coldblood', name: 'Cold Blood', family: 'move', max: 2,
      text: l => l === 1 ? 'Food eaten while braking is worth double.' : 'Food eaten while braking is worth triple.',
      hooks: { foodValue(v, l, c) { return c.braking ? v * (1 + l) : v; } } },
    // ---- Body
    { id: 'armoured', name: 'Armoured', family: 'body', max: 2,
      text: l => l === 1 ? 'Once per floor, biting yourself snaps your tail off instead of killing you.' : 'Snap your tail off twice per floor.',
      hooks: {
        onFloorStart(l, g) { g.charges.armour = l; },
        onSelfCollide(l, c) { if (game.charges.armour > 0) { game.charges.armour--; return 'snap'; } return null; },
      } },
    { id: 'battery', name: 'Battery', family: 'body', max: 3,
      text: () => 'Every tail segment adds 4% to the value of food.',
      hooks: { foodValue(v, l, c) { return v * (1 + CFG.mut.batteryPerSeg * l * Math.max(0, c.len - CFG.run.startLength)); } } },
    { id: 'spiked', name: 'Spiked', family: 'body', max: 2,
      text: l => 'Beetles that walk into your body die. +' + CFG.mut.spikedMult[l - 1] + '× food value each.',
      hooks: { onBeetleTouch(l) { return CFG.run.foodPoints * actOf(run.floor) * CFG.mut.spikedMult[l - 1]; } } },
    { id: 'lean', name: 'Lean', family: 'body', max: 1,
      text: () => 'Every other bite doesn’t grow your tail.',
      hooks: { onEat(l, info) { game.leanSkip = !game.leanSkip; if (game.leanSkip) info.grow = Math.max(0, info.grow - 1); } } },
    // ---- Appetite
    { id: 'magnet', name: 'Magnet', family: 'appetite', max: 3,
      text: l => 'Food within ' + CFG.mut.magnetRadius[l - 1] + ' tiles drifts towards your head.',
      hooks: { onStep(l, g) { magnetPull(g, CFG.mut.magnetRadius[l - 1]); } } },
    { id: 'golden', name: 'Golden Hour', family: 'appetite', max: 3,
      text: l => Math.round(CFG.mut.goldenChance[l - 1] * 100) + '% of food spawns golden: worth ×3, but it fades.',
      hooks: { onSpawnFood(l, g) { if (g.rng() < CFG.mut.goldenChance[l - 1]) { g.foodGolden = true; g.foodTtl = CFG.mut.goldenSteps; } } } },
    { id: 'gourmet', name: 'Gourmet', family: 'appetite', max: 3,
      text: l => 'Bites within ' + CFG.mut.gourmetWindow[l - 1] + ' moves of each other build a combo.',
      hooks: { foodBonus(v, l, c) {
        if (game.lastEatStep >= 0 && c.gap <= CFG.mut.gourmetWindow[l - 1]) { game.combo++; return v + c.base * CFG.mut.gourmetBonus * game.combo; }
        game.combo = 0; return v;
      } } },
    { id: 'second', name: 'Second Helping', family: 'appetite', max: 1,
      text: () => 'Each food counts double towards the floor target, but your tail grows by 2.',
      hooks: { onEat(l, info) { info.count = 2; info.grow += 1; } } },
  ];
  const MUT = Object.fromEntries(MUTATIONS.map(m => [m.id, m]));

  /* ---- Floor layouts (§6.5). 16 rows × 16 characters:
   *   #  wall          .  floor          A, B …  portal pair (two of each letter)
   * An empty map is an open board. Rows 7–9, columns 4–9 are always cleared for the
   * snake's start. Walls can sit on the edge: Wraparound only works where they don't. */
  const LAYOUTS = {
    open: [{ name: 'Open field', map: [] }],
    act1: [
      { name: 'Pillars', map: [
        '................', '................', '................', '...##......##...',
        '...##......##...', '................', '................', '................',
        '................', '................', '................', '...##......##...',
        '...##......##...', '................', '................', '................'] },
      { name: 'Crossbars', map: [
        '................', '................', '................', '................',
        '....########....', '................', '................', '................',
        '................', '................', '................', '................',
        '....########....', '................', '................', '................'] },
      { name: 'Gatehouse', map: [
        '######....######', '#..............#', '#..............#', '#..............#',
        '#..............#', '#..............#', '................', '................',
        '................', '................', '#..............#', '#..............#',
        '#..............#', '#..............#', '#..............#', '######....######'] },
    ],
    act2: [
      { name: 'Lanes', map: [
        '................', '................', '..#..........#..', '..#..........#..',
        '..#..........#..', '..#..........#..', '................', '................',
        '................', '................', '..#..........#..', '..#..........#..',
        '..#..........#..', '..#..........#..', '................', '................'] },
      { name: 'Brackets', map: [
        '................', '.#####....#####.', '.#............#.', '.#............#.',
        '................', '................', '................', '................',
        '................', '................', '................', '................',
        '.#............#.', '.#............#.', '.#####....#####.', '................'] },
      { name: 'Arena', map: [
        '################', '#..............#', '#..............#', '#...##....##...#',
        '#...##....##...#', '#..............#', '#..............#', '#..............#',
        '#..............#', '#..............#', '#..............#', '#...##....##...#',
        '#...##....##...#', '#..............#', '#..............#', '################'] },
    ],
    act3: [
      { name: 'Divide', map: [
        '............#...', '............#...', '..A.........#...', '............#...',
        '............#...', '............#...', '................', '................',
        '............#...', '............#...', '............#...', '............#...',
        '............#...', '............#.A.', '............#...', '............#...'] },
      { name: 'Crossroads', map: [
        '................', '................', '..A..........B..', '................',
        '.....#....#.....', '.....#....#.....', '................', '................',
        '................', '................', '.....#....#.....', '.....#....#.....',
        '................', '..B..........A..', '................', '................'] },
      { name: 'Gallery', map: [
        '................', '.##############.', '.A............B.', '................',
        '................', '................', '................', '................',
        '................', '................', '................', '................',
        '................', '.B............A.', '.##############.', '................'] },
    ],
    finale: [
      { name: 'The Nest', map: [
        '................', '.###........###.', '.#............#.', '.#............#.',
        '......##........', '...A............', '................', '................',
        '................', '................', '............A...', '........##......',
        '.#............#.', '.#............#.', '.###........###.', '................'] },
    ],
  };
  // What each floor draws from. A layout isn't repeated within a run while its pool has others left.
  const FLOORS = [
    { pool: 'open' },
    { pool: 'act1' }, { pool: 'act1' },
    { pool: 'act2', beetles: 1 }, { pool: 'act2', beetles: 2 }, { pool: 'act2', beetles: 3 },
    { pool: 'act3', beetles: 1 }, { pool: 'act3', beetles: 2, shrink: true },
    { pool: 'finale', beetles: 2, shrink: true },
  ];
  function parseLayout(def) {
    const walls = new Uint8Array(N * N), ends = {};
    (def.map || []).forEach((row, y) => {
      for (let x = 0; x < N; x++) {
        const ch = row[x] || '.';
        if (ch === '#') walls[y * N + x] = 1;
        else if (ch >= 'A' && ch <= 'Z') (ends[ch] = ends[ch] || []).push([x, y]);
      }
    });
    for (let y = 7; y <= 9; y++) for (let x = 4; x <= 9; x++) walls[y * N + x] = 0;
    const portals = new Map(), pairs = [];
    for (const e of Object.values(ends)) if (e.length === 2) {
      portals.set(e[0][0] + ',' + e[0][1], e[1]); portals.set(e[1][0] + ',' + e[1][1], e[0]); pairs.push(e);
    }
    return { walls, portals, pairs };
  }

  /* ====================================================================
   * 7. MUTATION HOOKS — mutations react to named events instead of being
   *    special-cased in the main loop. Only active during a run.
   *    emit(name, ctx)       fire and forget        (onFloorStart, onEat, onStep, onSpawnFood)
   *    reduce(name, v, ctx)  pass a value through  (foodValue, foodBonus, brakeMax, brakeRefill)
   *    first(name, ctx)      first non-null answer (onSelfCollide, onWall, onBeetleTouch)
   * ==================================================================== */
  const Hooks = {
    *each(name) {
      if (!run) return;
      for (const m of MUTATIONS) { const l = run.mutations[m.id]; if (l && m.hooks[name]) yield [m.hooks[name], l]; }
    },
    emit(name, ctx) { for (const [h, l] of this.each(name)) h(l, ctx); },
    reduce(name, v, ctx) { for (const [h, l] of this.each(name)) v = h(v, l, ctx); return v; },
    first(name, ctx) { for (const [h, l] of this.each(name)) { const r = h(l, ctx); if (r) return r; } return null; },
  };

  // Draft: pick `choices` distinct mutations that aren't maxed, weighted towards families you hold.
  function draftOptions() {
    const held = {};
    for (const id in run.mutations) held[MUT[id].family] = (held[MUT[id].family] || 0) + 1;
    let pool = MUTATIONS.filter(m => (run.mutations[m.id] || 0) < m.max)
      .map(m => ({ m, w: 1 + CFG.draft.familyBias * (held[m.family] || 0) }));
    const out = [];
    while (out.length < CFG.draft.choices && pool.length) {
      let r = run.rng() * pool.reduce((s, p) => s + p.w, 0);
      const i = pool.findIndex(p => (r -= p.w) < 0);
      out.push(pool[i < 0 ? pool.length - 1 : i].m);
      pool.splice(i < 0 ? pool.length - 1 : i, 1);
    }
    return out;
  }
  const buildText = () => run.build.length ? run.build.map(id => MUT[id].name + roman(run.mutations[id])).join(' · ') : 'No mutations';

  /* ====================================================================
   * DOM handles
   * ==================================================================== */
  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d'), board = $('board');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovLines = $('ovLines'), ovMsg = $('ovMsg'), ovMenu = $('ovMenu');
  const hudEl = $('hud'), meterEl = $('meter'), segsEl = $('segs'), hintEl = $('hint');
  const css = getComputedStyle(document.documentElement);
  const C = { lcd: css.getPropertyValue('--lcd').trim(), dim: css.getPropertyValue('--lcd-dim').trim(), px: css.getPropertyValue('--pixel').trim() };

  function setHud(items) {
    hudEl.replaceChildren(...items.map(([label, value]) => {
      const s = document.createElement('span'); s.textContent = label;
      const b = document.createElement('b'); b.textContent = value; s.append(b); return s;
    }));
  }
  // showOverlay(null) hides it. buttons: [{label, fn, cls, lock}] or cards: [{name, tag, text, fn, lock}]
  // lines can be strings or {text, cls}
  function showOverlay(o) {
    if (!o) { overlay.hidden = true; return; }
    ovTitle.textContent = o.title || '';
    ovLines.replaceChildren(...(o.lines || []).map(t => {
      const p = document.createElement('p'); p.className = 'sub' + (t.cls ? ' ' + t.cls : ''); p.textContent = t.text || t; return p;
    }));
    ovMsg.textContent = o.blink || ''; ovMsg.hidden = !o.blink;
    ovMenu.classList.toggle('cards', !!o.cards);
    ovMenu.replaceChildren(...(o.cards || o.buttons || []).map(b => {
      const el = document.createElement('button');
      if (b.name) {
        el.className = 'card';
        for (const [cls, txt] of [['cn', b.name], ['ct', b.tag], ['cd', b.text]]) { const s = document.createElement('span'); s.className = cls; s.textContent = txt; el.append(s); }
      } else { el.textContent = b.label; if (b.cls) el.className = b.cls; }
      el.addEventListener('click', () => { if (performance.now() - screenAt < (b.lock ? CFG.inputLockMs : 0)) return; el.blur(); Audio.unlock(); Audio.click(); b.fn(); });
      return el;
    }));
    overlay.hidden = false;
  }
  function setUnder(mode) { meterEl.hidden = mode !== 'meter'; hintEl.hidden = mode === 'meter'; if (typeof mode === 'string' && mode !== 'meter') hintEl.textContent = mode; }
  for (let i = 0; i < CFG.brake.segments; i++) segsEl.append(document.createElement('i'));

  /* ====================================================================
   * 9. AUDIO — tiny Web Audio synth (needs a tap before iOS will play)
   * ==================================================================== */
  const Audio = (() => {
    let ac = null;
    function unlock() {
      if (!ac) {
        const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
        try { ac = new A(); } catch (e) { return; }
        try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch (e) {}
      }
      if (ac.state === 'suspended') ac.resume().catch(() => {});
    }
    function tone(freq, dur, { type = 'square', vol = 0.06, slide = 0, delay = 0 } = {}) {
      if (!ac || !save.settings.sound) return;
      const t0 = ac.currentTime + delay, f = freq * (Brake.active() ? 0.78 : 1);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t0 + dur);
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    }
    const seq = (notes, gap, opts) => notes.forEach((f, i) => tone(f, gap * 1.3, { ...opts, delay: i * gap }));
    return {
      unlock,
      click: () => tone(520, 0.04, { vol: 0.04 }),
      bite:  () => { tone(660, 0.06); tone(990, 0.06, { delay: 0.045 }); },
      brake: () => tone(170, 0.09, { type: 'triangle', vol: 0.09 }),
      exit:  () => seq([523, 659, 784], 0.07, { vol: 0.05 }),
      clear: () => seq([523, 659, 784, 1047], 0.08, { vol: 0.06 }),
      win:   () => seq([523, 659, 784, 1047, 784, 1047, 1319], 0.1, { vol: 0.06 }),
      death: () => { tone(220, 0.35, { type: 'sawtooth', vol: 0.07, slide: 0.3 }); tone(110, 0.4, { vol: 0.05, slide: 0.5, delay: 0.05 }); },
      golden: () => { tone(880, 0.06); tone(1320, 0.07, { delay: 0.045 }); tone(1760, 0.08, { delay: 0.09 }); },
      snap:  () => tone(320, 0.18, { type: 'sawtooth', vol: 0.06, slide: 0.35 }),
      phase: () => tone(420, 0.16, { type: 'triangle', vol: 0.08, slide: 2 }),
      pick:  () => seq([392, 523, 659], 0.07, { vol: 0.05 }),
      portal: () => tone(300, 0.14, { type: 'triangle', vol: 0.07, slide: 3 }),
      squash: () => { tone(180, 0.08, { vol: 0.07, slide: 0.5 }); tone(880, 0.05, { delay: 0.06 }); },
      warn:  () => { tone(220, 0.1, { vol: 0.06 }); tone(220, 0.1, { vol: 0.06, delay: 0.18 }); },
      shrink: () => tone(90, 0.3, { type: 'sawtooth', vol: 0.08, slide: 0.6 }),
    };
  })();

  /* ====================================================================
   * 5. RUN MODEL & BOARD MODEL
   *    run   = the whole 9-floor attempt (score, mutations, seed)
   *    board = one floor or one classic game (snake, food, exit)
   * ==================================================================== */
  let run = null;     // null outside Run mode
  let game = null;    // the board currently in play

  function newRun() {
    const seed = newSeed();
    // mutations: { id: level }; build: ids in the order first picked (for display)
    return { seed, rng: mulberry32(seed), floor: 1, score: 0, mutations: {}, build: [], usedLayouts: [] };
  }

  function newBoard(mode) {
    const len = CFG.run.startLength;
    const g = {
      mode, phase: 'ready',
      rng: mode === 'run' ? mulberry32((run.rng() * 4294967296) >>> 0) : mulberry32(newSeed()),
      snake: Array.from({ length: len }, (_, i) => [7 - i, 8]),
      dir: 'right', queue: [], food: null, foodGolden: false, foodTtl: 0, exit: null, eaten: 0, score: 0, acc: 0, phaseAt: 0,
      stepCount: 0, growPending: 0, lastEatStep: -1, combo: 0, leanSkip: false, charges: { phase: 0, armour: 0 },
      walls: new Uint8Array(N * N), portals: new Map(), pairs: [], beetles: [], shrink: null, layoutName: '', cause: null,
    };
    game = g;
    if (mode === 'run') {
      const act = actOf(run.floor), fdef = FLOORS[run.floor - 1];
      g.target = CFG.run.targets[act - 1];
      g.stepMs = CFG.run.actStepMs[act - 1];
      const all = LAYOUTS[fdef.pool], fresh = all.filter(l => !run.usedLayouts.includes(l.name));
      const lay = pick(g.rng, fresh.length ? fresh : all);
      run.usedLayouts.push(lay.name);
      Object.assign(g, parseLayout(lay));
      g.layoutName = lay.name;
      if (fdef.shrink) g.shrink = { state: 'none', at: 0, ring: -1 };
      for (let i = 0; i < (fdef.beetles || 0); i++) spawnBeetle();
      Hooks.emit('onFloorStart', g);
    } else g.stepMs = CFG.classic.stepMs;
    wallsDirty = true;
    placeFood();
    return g;
  }

  const key = (x, y) => x + ',' + y;
  const inBounds = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
  const ringOf = (x, y) => Math.min(x, y, N - 1 - x, N - 1 - y);
  const beetleAt = (x, y) => game.beetles.find(b => b.x === x && b.y === y);
  function freeCells() {
    const taken = new Set(game.snake.map(([x, y]) => key(x, y)));
    if (game.food) taken.add(key(...game.food));
    if (game.exit) taken.add(key(...game.exit));
    for (const b of game.beetles) taken.add(key(b.x, b.y));
    const warnRing = game.shrink && game.shrink.state === 'warn' ? game.shrink.ring : -1;
    const free = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const k = key(x, y);
      if (!taken.has(k) && !game.walls[y * N + x] && !game.portals.has(k) && ringOf(x, y) !== warnRing) free.push([x, y]);
    }
    return free;
  }

  // Where something moving one tile from (x, y) ends up: through portals, and (for the
  // snake with Wraparound) across open edges. Returns { c: [x, y], portal } or { block }.
  function travel(x, y, [dx, dy], who) {
    let nx = x + dx, ny = y + dy;
    if (!inBounds(nx, ny)) {
      const w = who === 'snake' ? Hooks.first('onWall', [nx, ny]) : null;
      if (!w) return { block: 'wall' };
      [nx, ny] = w;
    }
    if (game.walls[ny * N + nx]) return { block: 'wall' };
    const p = game.portals.get(key(nx, ny));
    if (p) {
      nx = p[0] + dx; ny = p[1] + dy;
      if (!inBounds(nx, ny) || game.walls[ny * N + nx] || game.portals.has(key(nx, ny))) return { block: 'wall' };
      return { c: [nx, ny], portal: true };
    }
    return { c: [nx, ny] };
  }

  /* ---- Beetles: patrol in straight lines, bounce off walls, other beetles, food,
   *      the exit and your body. Touching your head kills you. */
  function spawnBeetle() {
    const [hx, hy] = game.snake[0], dirs = Object.values(DIRS);
    const spots = freeCells().filter(([x, y]) => Math.abs(x - hx) + Math.abs(y - hy) >= CFG.beetle.minSpawnDist
      && !game.beetles.some(b => Math.abs(b.x - x) + Math.abs(b.y - y) < 3)
      && dirs.some(d => travel(x, y, d, 'beetle').c));
    if (!spots.length) return;
    const [x, y] = pick(game.rng, spots);
    const [dx, dy] = pick(game.rng, dirs.filter(d => travel(x, y, d, 'beetle').c));
    game.beetles.push({ x, y, dx, dy, legs: 0 });
  }
  function beetleBlocked(c, self) {
    if (!c) return 'block';
    const [x, y] = c, i = game.snake.findIndex(([a, b]) => a === x && b === y);
    if (i === 0) return 'head';
    if (i > 0) return 'body';
    if (game.beetles.some(o => o !== self && o.x === x && o.y === y)) return 'block';
    if (game.food && game.food[0] === x && game.food[1] === y) return 'block';
    if (game.exit && game.exit[0] === x && game.exit[1] === y) return 'block';
    return null;
  }
  // Returns false if a beetle caught the snake.
  function moveBeetles() {
    for (const b of [...game.beetles]) {
      for (let attempt = 0; attempt < 2; attempt++) {
        const mv = travel(b.x, b.y, [b.dx, b.dy], 'beetle');
        const hit = beetleBlocked(mv.c, b);
        if (hit === 'head') { die(false, 'beetle'); return false; }
        if (hit === 'body') { const pts = Hooks.first('onBeetleTouch', b); if (pts) { squashBeetle(b, pts); break; } }
        if (!hit) { b.x = mv.c[0]; b.y = mv.c[1]; b.legs ^= 1; break; }
        b.dx = -b.dx; b.dy = -b.dy;   // bounce, then try the other way
      }
    }
    return true;
  }
  function squashBeetle(b, pts) {
    game.beetles.splice(game.beetles.indexOf(b), 1);
    pts = Math.round(pts); run.score += pts;
    FX.burst([b.x, b.y], 10); FX.popup([b.x, b.y], '+' + pts); Audio.squash();
    screen.hud();
  }

  /* ---- Shrinking boards: at half the food target, the outermost ring that isn't
   *      already solid flashes, then becomes wall. Anything caught in it is lost. */
  function updateShrink() {
    const s = game.shrink;
    if (!s || s.state === 'done') return true;
    if (s.state === 'none' && game.eaten >= Math.ceil(game.target / 2)) {
      for (let k = 0; k < N / 2 && s.ring < 0; k++)
        for (let y = 0; y < N && s.ring < 0; y++) for (let x = 0; x < N; x++) if (ringOf(x, y) === k && !game.walls[y * N + x]) { s.ring = k; break; }
      if (s.ring < 0) { s.state = 'done'; return true; }
      s.state = 'warn'; s.at = game.stepCount;
      FX.popup([N / 2 - 0.5, N / 2 - 3], 'SHRINKING'); Audio.warn();
      if (game.exit && ringOf(...game.exit) === s.ring) { game.exit = null; openExit(); }
      return true;
    }
    if (s.state === 'warn' && game.stepCount - s.at >= CFG.shrink.warnSteps) {
      s.state = 'done';
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (ringOf(x, y) === s.ring) {
        game.walls[y * N + x] = 1;
        const p = game.portals.get(key(x, y));
        if (p) { game.portals.delete(key(x, y)); game.portals.delete(key(...p)); game.pairs = game.pairs.filter(e => !e.some(c => c[0] === x && c[1] === y)); }
      }
      wallsDirty = true; FX.shake(0.6); Audio.shrink();
      if (game.snake.some(([x, y]) => ringOf(x, y) === s.ring)) { die(false, 'shrink'); return false; }
      game.beetles = game.beetles.filter(b => { if (ringOf(b.x, b.y) !== s.ring) return true; FX.burst([b.x, b.y], 4); return false; });
      if (game.food && ringOf(...game.food) === s.ring) placeFood();
      if (game.exit && ringOf(...game.exit) === s.ring) { game.exit = null; openExit(); }
    }
    return true;
  }
  function placeFood() {
    game.food = null; game.foodGolden = false; game.foodTtl = 0;
    const free = freeCells(); game.food = free.length ? pick(game.rng, free) : null;
    if (game.food && game.mode === 'run') Hooks.emit('onSpawnFood', game);
  }
  function cellFree(x, y) {
    if (!inBounds(x, y) || game.walls[y * N + x] || game.portals.has(key(x, y)) || beetleAt(x, y)) return false;
    if (game.exit && game.exit[0] === x && game.exit[1] === y) return false;
    return !game.snake.some(([a, b]) => a === x && b === y);
  }
  // Magnet: every few moves, food within range takes one step towards the head (never onto it).
  // Food that drifts into a portal comes out of its pair.
  function magnetPull(g, radius) {
    if (!g.food || g.stepCount % CFG.mut.magnetEvery) return;
    const [hx, hy] = g.snake[0], [fx, fy] = g.food, dx = hx - fx, dy = hy - fy, dist = Math.abs(dx) + Math.abs(dy);
    if (dist > radius || dist <= 1) return;
    const xs = [Math.sign(dx), 0], ys = [0, Math.sign(dy)];
    for (const [mx, my] of Math.abs(dx) >= Math.abs(dy) ? [xs, ys] : [ys, xs]) {
      if (!mx && !my) continue;
      const mv = travel(fx, fy, [mx, my], 'food');
      if (mv.c && cellFree(...mv.c)) { g.food = mv.c; return; }
    }
  }
  function openExit() {
    const [hx, hy] = game.snake[0];
    const free = freeCells();
    const far = free.filter(([x, y]) => Math.abs(x - hx) + Math.abs(y - hy) >= 5);
    game.exit = pick(game.rng, far.length ? far : free);
    FX.sweep(game.exit);
    Audio.exit();
  }

  const isOpposite = (a, b) => DIRS[a][0] === -DIRS[b][0] && DIRS[a][1] === -DIRS[b][1];
  function steer(d) {
    const last = game.queue.length ? game.queue[game.queue.length - 1] : game.dir;
    if (d === last || isOpposite(d, last)) return;
    if (game.queue.length < CFG.queueMax) game.queue.push(d);
  }
  function startBoard(d) {
    if (d && !isOpposite(d, game.dir)) game.dir = d;
    game.phase = 'playing'; game.acc = 0;
    showOverlay(null);
  }

  // One grid move. Returns false when the board stops (death, clear).
  function step() {
    if (game.queue.length) game.dir = game.queue.shift();
    game.stepCount++;
    const mv = travel(game.snake[0][0], game.snake[0][1], DIRS[game.dir], 'snake');
    if (mv.block) { die(false, 'wall'); return false; }
    const head = mv.c;
    if (mv.portal) Audio.portal();
    if (beetleAt(...head)) { die(false, 'beetle'); return false; }
    const eating = game.food && head[0] === game.food[0] && head[1] === game.food[1];
    const tailStays = eating || game.growPending > 0;
    const body = tailStays ? game.snake : game.snake.slice(0, -1);
    const hit = body.findIndex(([x, y]) => x === head[0] && y === head[1]);
    if (hit >= 0) {
      const rescue = game.mode === 'run' ? Hooks.first('onSelfCollide', { index: hit }) : null;
      if (rescue === 'snap') snapTail(hit, head);
      else if (rescue === 'phase') { FX.popup(head, 'PHASE'); Audio.phase(); }
      else { die(false, 'self'); return false; }
    }
    game.snake.unshift(head);
    if (game.exit && head[0] === game.exit[0] && head[1] === game.exit[1]) { game.snake.pop(); clearFloor(); return false; }
    if (eating) {
      const grow = eat();
      if (grow === 0) game.snake.pop(); else game.growPending += grow - 1;
      if (game.snake.length === N * N) { die(true); return false; }
    } else if (game.growPending > 0) game.growPending--;
    else game.snake.pop();
    if (game.mode === 'run') {
      Hooks.emit('onStep', game);
      if (game.foodGolden && --game.foodTtl <= 0) { game.foodGolden = false; game.foodTtl = 0; }
      showCharges();
      if (game.beetles.length && game.stepCount % CFG.beetle.everySteps === 0 && !moveBeetles()) return false;
      if (!updateShrink()) return false;
    }
    return true;
  }

  // Armoured: everything from the bitten segment back falls away.
  function snapTail(i, head) {
    const lost = game.snake.splice(i);
    lost.forEach(c => FX.burst(c, 3));
    FX.popup(head, 'SNAP'); FX.shake(0.5); Audio.snap();
  }

  // Returns how many segments the snake grows by (0 = none).
  function eat() {
    const pos = game.food, golden = game.foodGolden;
    let grow = 1;
    if (game.mode === 'run') {
      const base = CFG.run.foodPoints * actOf(run.floor) * (golden ? CFG.mut.goldenMult : 1);
      let v = Hooks.reduce('foodValue', base, { braking: Brake.active(), len: game.snake.length - 1 });
      v = Hooks.reduce('foodBonus', v, { base, gap: game.stepCount - game.lastEatStep });
      v = Math.round(v);
      game.lastEatStep = game.stepCount;
      const info = { count: 1, grow: 1 };
      Hooks.emit('onEat', info);
      grow = info.grow;
      const before = game.eaten;
      game.eaten += info.count;
      run.score += v;
      FX.popup(pos, '+' + v + (game.combo > 0 ? ' x' + (game.combo + 1) : ''));
      placeFood();
      if (before < game.target && game.eaten >= game.target) openExit();
    } else {
      game.score++;
      const c = CFG.classic;
      if (game.score % c.speedupEvery === 0) game.stepMs = Math.max(c.minStepMs, c.stepMs - Math.floor(game.score / c.speedupEvery) * c.speedupMs);
      placeFood();
    }
    FX.burst(pos); golden ? Audio.golden() : Audio.bite();
    screen.hud();
    return grow;
  }

  let chargesShown = null;
  function showCharges() {
    const parts = [];
    if (run && run.mutations.phase) parts.push('Phase ' + game.charges.phase);
    if (run && run.mutations.armoured) parts.push('Armour ' + game.charges.armour);
    const t = parts.join(' · ');
    if (t !== chargesShown) { chargesShown = t; $('charges').textContent = t; }
  }

  function die(won, cause) {
    game.phase = 'dying'; game.phaseAt = performance.now(); game.won = !!won; game.cause = cause || null;
    if (won) Audio.win(); else { Audio.death(); FX.shake(); }
  }

  function clearFloor() {
    game.phase = 'cleared'; game.phaseAt = performance.now();
    game.bonus = CFG.run.clearBonus * run.floor;
    run.score += game.bonus;
    Audio.clear(); screen.hud();
  }

  const CAUSES = { wall: 'hit a wall', self: 'bit yourself', beetle: 'caught by a beetle', shrink: 'crushed by the shrink', abandon: 'abandoned' };
  function endRun(won, cause) {
    if (won) run.score += CFG.run.winBonus;
    run.cause = cause;
    const st = save.stats;
    st.runs++; if (won) st.wins++;
    st.bestFloor = Math.max(st.bestFloor, run.floor);
    const newBest = run.score > st.bestRunScore;
    st.bestRunScore = Math.max(st.bestRunScore, run.score);
    writeSave();
    setScreen('results', { won, floor: run.floor, score: run.score, newBest });
  }

  /* ====================================================================
   * BRAKE — hold-to-slow with a meter (Run mode only)
   * ==================================================================== */
  const Brake = {
    held: false, meter: CFG.brake.maxMs, max: CFG.brake.maxMs, refillMs: CFG.brake.refillMs, exhausted: false, was: false, shown: -1,
    reset(max, refillMs) { this.max = max; this.refillMs = refillMs; this.meter = max; this.exhausted = false; this.shown = -1; },
    active() { return this.held && !this.exhausted && game && game.mode === 'run' && game.phase === 'playing'; },
    update(dt) {
      const b = CFG.brake;
      const on = this.active();
      if (on) { this.meter -= dt; if (this.meter <= 0) { this.meter = 0; this.exhausted = true; } }
      else {
        this.meter = Math.min(this.max, this.meter + dt * this.max / this.refillMs);
        if (this.exhausted && this.meter >= this.max * b.resumeAt) this.exhausted = false;
      }
      if (on && !this.was) Audio.brake();
      this.was = on;
      // meter UI (only touch the DOM when a segment changes)
      const lit = Math.ceil(this.meter / this.max * b.segments) + (this.exhausted ? 100 : 0);
      if (lit !== this.shown) {
        this.shown = lit;
        const n = lit % 100;
        [...segsEl.children].forEach((el, i) => el.classList.toggle('on', i < n));
        meterEl.classList.toggle('empty', this.exhausted);
      }
    },
  };

  /* ====================================================================
   * 8. RENDERING — canvas, particles, screen shake
   * ==================================================================== */
  let cell = 20, bg = null, wallLayer = null, wallsDirty = true;
  // Walls are static, so draw them once per floor (and again after a shrink) as bricks.
  function renderWalls() {
    wallsDirty = false;
    if (!wallLayer || wallLayer.width !== canvas.width) { wallLayer = document.createElement('canvas'); wallLayer.width = canvas.width; wallLayer.height = canvas.height; }
    const w = wallLayer.getContext('2d');
    w.clearRect(0, 0, wallLayer.width, wallLayer.height);
    if (!game) return;
    const m = Math.max(1, cell * 0.07);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (game.walls[y * N + x]) {
      const X = x * cell, Y = y * cell;
      w.fillStyle = C.px; w.fillRect(X, Y, cell, cell);
      w.fillStyle = C.dim;   // mortar: one course line and staggered joints
      w.fillRect(X, Y + cell / 2 - m / 2, cell, m);
      w.fillRect(X + cell / 2 - m / 2, Y + m, m, cell / 2 - m * 1.5);
      w.fillRect(X + (x % 2 ? cell - m : 0), Y + cell / 2 + m / 2, m, cell / 2 - m);
    }
  }
  function resize() {
    const size = board.clientWidth, dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr); canvas.height = Math.round(size * dpr);
    cell = canvas.width / N;
    // pre-render the LCD with its ghost pixels
    bg = document.createElement('canvas'); bg.width = canvas.width; bg.height = canvas.height;
    const b = bg.getContext('2d');
    b.fillStyle = C.lcd; b.fillRect(0, 0, bg.width, bg.height);
    b.fillStyle = C.dim;
    const p = cell * 0.08;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) b.fillRect(x * cell + p, y * cell + p, cell - 2 * p, cell - 2 * p);
    wallsDirty = true;
  }
  function block(x, y, inset, color) {
    const p = cell * inset;
    ctx.fillStyle = color;
    ctx.fillRect(x * cell + p, y * cell + p, cell - 2 * p, cell - 2 * p);
  }
  function frameCell(x, y, inset, w) {
    const p = cell * inset, s = cell - 2 * p, t = cell * w;
    ctx.fillStyle = C.px;
    ctx.fillRect(x * cell + p, y * cell + p, s, t); ctx.fillRect(x * cell + p, y * cell + p + s - t, s, t);
    ctx.fillRect(x * cell + p, y * cell + p, t, s); ctx.fillRect(x * cell + p + s - t, y * cell + p, t, s);
  }

  const FX = {
    parts: [], shakeAt: -1e9, shakeScale: 1, sweeps: [], pops: [],
    burst([x, y], count = CFG.fx.burstCount) {
      const now = performance.now();
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + Math.random() * 0.6, v = 2.2 + Math.random() * 1.6;
        this.parts.push({ x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, born: now });
      }
    },
    shake(scale = 1) { this.shakeAt = performance.now(); this.shakeScale = scale; },
    sweep(c) { this.sweeps.push({ c, born: performance.now() }); },
    popup([x, y], text) { this.pops.push({ x: x + 0.5, y: y + 0.5, text, born: performance.now() }); },
    clear() { this.parts = []; this.sweeps = []; this.pops = []; this.shakeAt = -1e9; },
    draw(now) {
      const f = CFG.fx;
      // score popups: rise and fade, kept inside the board
      this.pops = this.pops.filter(p => now - p.born < f.popupMs);
      if (this.pops.length) {
        ctx.font = Math.round(cell * 0.85) + 'px VT323, "Courier New", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.px;
        for (const p of this.pops) {
          const k = (now - p.born) / f.popupMs, w = ctx.measureText(p.text).width;
          const px = Math.min(canvas.width - w / 2 - 2, Math.max(w / 2 + 2, p.x * cell));
          const py = Math.max(cell * 0.5, (p.y - 0.9 - k * 0.9) * cell);
          ctx.globalAlpha = 1 - k * k; ctx.fillText(p.text, px, py);
        }
        ctx.globalAlpha = 1;
      }
      this.parts = this.parts.filter(p => now - p.born < f.burstMs);
      ctx.fillStyle = C.px;
      for (const p of this.parts) {
        const t = (now - p.born) / 1000, s = cell * 0.2 * (1 - (now - p.born) / f.burstMs);
        ctx.fillRect((p.x + p.vx * t) * cell - s / 2, (p.y + p.vy * t) * cell - s / 2, s, s);
      }
      this.sweeps = this.sweeps.filter(s => now - s.born < f.exitSweepMs);
      ctx.strokeStyle = C.px; ctx.lineWidth = cell * 0.12;
      for (const s of this.sweeps) {
        const k = (now - s.born) / f.exitSweepMs, r = (0.5 + k * 3.5) * cell, cx = (s.c[0] + 0.5) * cell, cy = (s.c[1] + 0.5) * cell;
        ctx.globalAlpha = 1 - k; ctx.strokeRect(cx - r, cy - r, r * 2, r * 2); ctx.globalAlpha = 1;
      }
    },
    offset(now) {
      const k = 1 - (now - this.shakeAt) / CFG.fx.shakeMs;
      if (k <= 0) return [0, 0];
      const m = CFG.fx.shakeCells * this.shakeScale * cell * k;
      return [(Math.random() * 2 - 1) * m, (Math.random() * 2 - 1) * m];
    },
  };

  function draw(now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    const [ox, oy] = FX.offset(now);
    ctx.translate(ox, oy);
    if (game && screen.board) {
      if (wallsDirty) renderWalls();
      ctx.drawImage(wallLayer, 0, 0);
      const s = game.shrink;
      if (s && s.state === 'warn' && Math.floor(now / 160) % 2 === 0) {
        ctx.globalAlpha = 0.5;
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (ringOf(x, y) === s.ring && !game.walls[y * N + x]) block(x, y, 0.16, C.px);
        ctx.globalAlpha = 1;
      }
      game.pairs.forEach((pair, i) => pair.forEach(([x, y]) => {
        // portals: a frame with a pulsing core; the second pair has a hollow core
        frameCell(x, y, 0.04, 0.12);
        const k = 0.3 + 0.06 * Math.sin(now / 160 + i * 1.7);
        if (i % 2) frameCell(x, y, k, 0.1); else block(x, y, k, C.px);
      }));
      for (const b of game.beetles) {
        // beetles: a round-ish body with legs that shuffle each move
        block(b.x, b.y, 0.26, C.px);
        const L = cell * 0.14, o = cell * (b.legs ? 0.08 : 0.14), X = b.x * cell, Y = b.y * cell;
        ctx.fillRect(X + o, Y + o, L, L); ctx.fillRect(X + cell - o - L, Y + o, L, L);
        ctx.fillRect(X + o, Y + cell - o - L, L, L); ctx.fillRect(X + cell - o - L, Y + cell - o - L, L, L);
      }
      if (game.exit) {
        const on = game.phase === 'cleared' ? Math.floor(now / 80) % 2 === 0 : Math.floor(now / 300) % 2 === 0;
        frameCell(game.exit[0], game.exit[1], 0.06, 0.16);
        if (on) block(game.exit[0], game.exit[1], 0.34, C.px);
      }
      if (game.food) {
        const [fx, fy] = game.food;
        if (game.foodGolden) {
          // golden food: a ringed square that blinks as it's about to fade
          if (!(game.foodTtl < 12 && Math.floor(now / 110) % 2)) { block(fx, fy, 0.12, C.px); block(fx, fy, 0.24, C.lcd); block(fx, fy, 0.36, C.px); }
        } else block(fx, fy, 0.28, C.px);
      }
      if (run && run.mutations.wrap && game.mode === 'run') {
        // Wraparound: a dash on every stretch of edge you can cross (both sides open)
        const t = cell * 0.08, W = game.walls, E = N - 1;
        ctx.fillStyle = C.px;
        for (let i = 0; i < N; i++) {
          if (!W[i] && !W[E * N + i]) { ctx.fillRect(i * cell + cell * 0.25, 0, cell * 0.5, t); ctx.fillRect(i * cell + cell * 0.25, canvas.height - t, cell * 0.5, t); }
          if (!W[i * N] && !W[i * N + E]) { ctx.fillRect(0, i * cell + cell * 0.25, t, cell * 0.5); ctx.fillRect(canvas.width - t, i * cell + cell * 0.25, t, cell * 0.5); }
        }
      }
      const flashing = game.phase === 'dying' && !game.won && Math.floor((now - game.phaseAt) / 90) % 2 === 1;
      if (!flashing) game.snake.forEach(([x, y], i) => block(x, y, i === 0 ? 0.04 : 0.1, C.px));
    }
    FX.draw(now);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (Brake.active()) { ctx.fillStyle = 'rgba(38,51,31,.10)'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    if (!overlay.hidden) { ctx.fillStyle = 'rgba(167,185,138,.74)'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  }

  /* ====================================================================
   * 4. SCREEN STATE MACHINE
   *    title → play(run, floor 1) → play(floor 2) … → results → title
   *    title → play(classic)
   *    floors 1–8 end on the draft screen: play → draft → play(next floor)
   * ==================================================================== */
  let screen = null, screenName = '', screenAt = 0;
  function setScreen(name, data) {
    screenName = name; screen = SCREENS[name]; screenAt = performance.now();
    screen.enter(data || {});
  }

  function soundButton() {
    return { label: 'Sound: ' + (save.settings.sound ? 'On' : 'Off'), cls: 'ghost wide', fn: toggleSound };
  }
  function toggleSound() {
    save.settings.sound = !save.settings.sound; writeSave();
    if (screenName === 'title') screen.enter({});
  }
  function beginRun() { run = newRun(); setScreen('play', { mode: 'run' }); }
  function beginClassic() { run = null; setScreen('play', { mode: 'classic' }); }

  const SCREENS = {
    title: {
      board: false,
      enter() {
        game = null; run = null; FX.clear();
        const st = save.stats;
        this.hud = () => setHud([['Runs', st.runs], ['Best fl', st.bestFloor], ['Classic', st.classicBest]]);
        this.hud();
        setUnder('Swipe to steer · hold to brake');
        showOverlay({
          title: 'SNAKE', lines: ['Nine floors. One snake.'],
          buttons: [{ label: 'Run', fn: beginRun }, { label: 'Classic', fn: beginClassic, cls: 'ghost' }, soundButton()],
        });
      },
      update() {},
      input(a) { if (a === 'run') beginRun(); else if (a === 'classic') beginClassic(); else if (a === 'mute') toggleSound(); },
    },

    play: {
      board: true,
      enter(d) {
        FX.clear();
        newBoard(d.mode);
        if (d.mode === 'run') {
          Brake.reset(Hooks.reduce('brakeMax', CFG.brake.maxMs), Hooks.reduce('brakeRefill', CFG.brake.refillMs));
          this.hud = () => setHud([['Score', run.score], ['Floor', run.floor + '/' + CFG.run.floors], ['Food', Math.min(game.eaten, game.target) + '/' + game.target]]);
          setUnder('meter'); chargesShown = null; showCharges();
          const act = actOf(run.floor);
          const lines = [];
          if (d.picked) lines.push('Gained ' + MUT[d.picked].name + roman(run.mutations[d.picked]));
          lines.push('Act ' + act + ' · eat ' + game.target + ', then exit');
          const threats = [];
          if (game.beetles.length) threats.push(game.beetles.length === 1 ? '1 beetle' : game.beetles.length + ' beetles');
          if (game.pairs.length) threats.push('portals');
          if (game.shrink) threats.push('shrinks at ' + Math.ceil(game.target / 2) + ' food');
          if (threats.length) lines.push(threats.join(' · '));
          showOverlay({ title: 'FLOOR ' + run.floor, lines, blink: 'Swipe to start', buttons: [{ label: 'Abandon run', cls: 'ghost', fn: () => endRun(false, 'abandon') }] });
        } else {
          this.hud = () => setHud([['Score', game.score], ['Best', save.stats.classicBest]]);
          setUnder('Swipe anywhere on screen · arrow keys work too');
          showOverlay({ title: 'CLASSIC', blink: 'Swipe to start', buttons: [{ label: 'Menu', cls: 'ghost', fn: () => setScreen('title') }] });
        }
        this.hud();
      },
      update(dt, now) {
        Brake.update(dt);
        if (game.phase === 'playing') {
          game.acc += dt * (Brake.active() ? CFG.brake.timeScale : 1);
          while (game.acc >= game.stepMs && game.phase === 'playing') { game.acc -= game.stepMs; if (!step()) break; }
        } else if (game.phase === 'dying' && now - game.phaseAt >= CFG.fx.deathMs) {
          if (game.mode === 'run') endRun(false, game.cause); else this.classicOver();
        } else if (game.phase === 'cleared' && now - game.phaseAt >= CFG.run.clearPauseMs) {
          if (run.floor >= CFG.run.floors) endRun(true);
          else setScreen('draft', { cleared: run.floor, bonus: game.bonus });
        }
      },
      classicOver() {
        game.phase = 'over'; screenAt = performance.now();
        const st = save.stats, newBest = game.score > st.classicBest;
        if (newBest) { st.classicBest = game.score; writeSave(); }
        this.hud();
        showOverlay({
          title: game.won ? 'YOU WIN' : 'GAME OVER',
          lines: ['Score ' + game.score + (newBest && game.score > 0 ? ' · new best!' : '')],
          blink: 'Swipe to play again',
          buttons: [{ label: 'Menu', cls: 'ghost', fn: () => setScreen('title'), lock: true }],
        });
      },
      input(a, d) {
        if (a === 'dir') {
          if (game.phase === 'ready') startBoard(d);
          else if (game.phase === 'playing') steer(d);
          else if (game.phase === 'over' && performance.now() - screenAt > CFG.inputLockMs) { setScreen('play', { mode: 'classic' }); startBoard(d); }
        } else if (a === 'go') {
          if (game.phase === 'ready') startBoard();
        } else if (a === 'menu') {
          if (game.mode === 'classic') setScreen('title');
        }
      },
    },

    // Between floors: choose 1 of 3 mutations. The cleared board stays visible underneath.
    draft: {
      board: true,
      enter(d) {
        game.phase = 'over';
        this.opts = draftOptions();
        this.hud = () => setHud([['Score', run.score], ['Next floor', (run.floor + 1) + '/' + CFG.run.floors]]);
        this.hud();
        setUnder('Floor ' + d.cleared + ' clear +' + d.bonus + ' · keep it all run');
        showOverlay({
          title: 'MUTATE',
          cards: this.opts.map((m, i) => {
            const next = (run.mutations[m.id] || 0) + 1;
            return { name: m.name + roman(next), tag: FAMILIES[m.family], text: m.text(next), fn: () => this.pick(i), lock: true };
          }),
        });
      },
      pick(i) {
        const m = this.opts[i]; if (!m) return;
        run.mutations[m.id] = (run.mutations[m.id] || 0) + 1;
        if (!run.build.includes(m.id)) run.build.push(m.id);
        Audio.pick();
        run.floor++;
        setScreen('play', { mode: 'run', picked: m.id });
      },
      update() {},
      input(a, d) {
        if (a === 'pick' && performance.now() - screenAt >= CFG.inputLockMs) this.pick(d);
      },
    },

    results: {
      board: true,
      enter(d) {
        game.phase = 'over';
        const st = save.stats;
        this.hud = () => setHud([['Score', d.score], ['Best', st.bestRunScore]]);
        this.hud();
        setUnder('Runs ' + st.runs + ' · wins ' + st.wins);
        const why = CAUSES[run.cause];
        const lines = d.won ? ['All 9 floors cleared'] : ['Floor ' + d.floor + (why ? ' · ' + why : '')];
        lines.push('Score ' + d.score + (d.newBest ? ' · new best!' : ''));
        lines.push({ text: buildText(), cls: 'build' });
        showOverlay({
          title: d.won ? 'YOU WIN' : 'RUN OVER', lines,
          buttons: [{ label: 'Run again', fn: beginRun, lock: true }, { label: 'Menu', cls: 'ghost', fn: () => setScreen('title'), lock: true }],
        });
      },
      update() {},
      input(a) {
        if (performance.now() - screenAt < CFG.inputLockMs) return;
        if (a === 'run' || a === 'go') beginRun(); else if (a === 'menu') setScreen('title');
      },
    },
  };

  /* ====================================================================
   * 10. INPUT — swipe, hold-to-brake, keyboard
   * ==================================================================== */
  const send = (a, d) => screen.input(a, d);

  // Swipe: a direction fires as soon as the finger has moved far enough, and the
  // anchor resets so turns chain without lifting. Holding still brakes; swiping
  // while braking still steers. Edges are left to the phone's own gestures.
  const T = { active: false, sx: 0, sy: 0, hx: 0, hy: 0, stillSince: 0 };
  function inSafeZone(t) {
    const e = CFG.swipe.edge;
    return t.clientX > e && t.clientX < window.innerWidth - e && t.clientY > e && t.clientY < window.innerHeight - e;
  }
  document.addEventListener('touchstart', e => {
    Audio.unlock();
    if (e.target.closest && e.target.closest('button')) return;   // let buttons get their tap
    const t = e.touches[0];
    if (e.touches.length > 1) { e.preventDefault(); return; }
    if (!inSafeZone(t)) { T.active = false; return; }
    T.active = true; T.sx = T.hx = t.clientX; T.sy = T.hy = t.clientY; T.stillSince = performance.now();
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (!T.active) return;
    e.preventDefault();
    const t = e.touches[0];
    if (Math.hypot(t.clientX - T.hx, t.clientY - T.hy) > CFG.brake.stillPx) { T.hx = t.clientX; T.hy = t.clientY; T.stillSince = performance.now(); }
    const dx = t.clientX - T.sx, dy = t.clientY - T.sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < CFG.swipe.thresh) return;
    send('dir', Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    T.sx = t.clientX; T.sy = t.clientY;
  }, { passive: false });
  const endTouch = e => { Audio.unlock(); if (e.touches.length === 0) { T.active = false; Brake.held = false; } };
  document.addEventListener('touchend', endTouch);
  document.addEventListener('touchcancel', endTouch);
  function pollHold(now) {
    if (T.active && !Brake.held && now - T.stillSince >= CFG.brake.holdMs) Brake.held = true;
  }

  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  window.addEventListener('keydown', e => {
    Audio.unlock();
    const d = KEYS[e.key];
    if (d) { e.preventDefault(); send('dir', d); return; }
    if (e.key === ' ') { e.preventDefault(); if (!e.repeat) { Brake.held = true; send('go'); } return; }
    if (e.repeat) return;
    if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') { e.preventDefault(); send('run'); }
    else if (e.key === 'c' || e.key === 'C') send('classic');
    else if (e.key === 'm' || e.key === 'M') send('mute');
    else if (e.key === 'Escape') send('menu');
    else if (e.key === '1' || e.key === '2' || e.key === '3') send('pick', +e.key - 1);
  });
  window.addEventListener('keyup', e => { if (e.key === ' ') Brake.held = false; });
  // Mouse click on the board starts a floor on desktop
  board.addEventListener('mousedown', e => { if (!e.target.closest('button')) { Audio.unlock(); send('go'); } });

  /* ====================================================================
   * BOOT — requestAnimationFrame loop with a time accumulator
   * ==================================================================== */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, Math.max(0, now - last)); last = now;
    pollHold(now);
    screen.update(dt, now);
    draw(now);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); T.active = false; Brake.held = false; });
  window.addEventListener('resize', resize);
  resize();
  setScreen('title');
  requestAnimationFrame(frame);

  // test hook (harmless in production)
  window.__snake = { get game() { return game; }, get run() { return run; }, get screen() { return screenName; }, get opts() { return screen.opts; }, save, Brake, setScreen, MUT, draftOptions, step, LAYOUTS, FLOORS, parseLayout, moveBeetles };
})();
</script>

<script>
// Offline support + update banner
const APP_VERSION = '9';
document.getElementById('ver').textContent = APP_VERSION;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      const btn = document.getElementById('update');
      let reloading = false;
      const reload = () => { if (!reloading) { reloading = true; location.reload(); } };
      // Tap → tell the waiting worker to take over → reload once it has actually switched on.
      // Reloading before then would let the old worker serve the old page again (iOS can be slow
      // to fire controllerchange), so we listen for 'activated' too and only use a timer as a last resort.
      const show = w => {
        btn.hidden = false;
        btn.onclick = () => {
          const nw = reg.waiting || w;
          btn.textContent = 'Updating…'; btn.disabled = true;
          if (!nw || nw.state === 'activated') return reload();
          nw.addEventListener('statechange', () => { if (nw.state === 'activated') reload(); });
          nw.postMessage('skipWaiting');
          setTimeout(reload, 5000);
        };
      };
      // Catch an update whatever stage it's at: already waiting, mid-download, or found later.
      const track = w => {
        if (!w) return;
        const check = () => { if (w.state === 'installed' && navigator.serviceWorker.controller) show(w); };
        check();
        w.addEventListener('statechange', check);
      };
      track(reg.waiting);
      track(reg.installing);
      reg.addEventListener('updatefound', () => track(reg.installing));
      reg.update().catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', reload);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(()=>{}); });
    } catch (e) {}
  });
}
</script>
